services:
  collector:
    image: ghcr.io/zaiwuli/sehuatang-collector:latest
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - ./data:/data
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your Avdb database}
    restart: unless-stopped
